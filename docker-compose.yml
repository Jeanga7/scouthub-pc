services:
  postgres:
    image: postgres:17-alpine
    container_name: scouthub-postgres
    environment:
      POSTGRES_DB: scouthub
      POSTGRES_USER: scouthub
      POSTGRES_PASSWORD: scouthub
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scouthub -d scouthub"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - scouthub-postgres-data:/var/lib/postgresql/data

volumes:
  scouthub-postgres-data:
